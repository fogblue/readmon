<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법적 고지 · 리드몬</title>
<style>
:root { color-scheme: light dark; --fg:#1a1a1a; --muted:#5c5c5c; --bg:#fdfdfc;
        --line:#e0ddd6; --accent:#7a5c3e; --card:#f6f4ef; }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e8e6e1; --muted:#a8a49c; --bg:#16150f; --line:#33302a;
          --accent:#c8a882; --card:#1f1d16; }
}
* { box-sizing: border-box; }
body { margin:0; padding:0 20px 96px; background:var(--bg); color:var(--fg);
       font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                    "Pretendard", "Noto Sans KR", sans-serif;
       line-height:1.75; font-size:16px; word-break:keep-all; }
main { max-width: 44rem; margin: 0 auto; }
header.site { max-width:44rem; margin:0 auto; padding:32px 0 8px;
              border-bottom:1px solid var(--line); }
header.site a { color:var(--muted); text-decoration:none; font-size:.85rem; }
header.site a:hover { color:var(--accent); }
h1 { font-size:1.7rem; line-height:1.4; margin:1.6em 0 .2em; letter-spacing:-.01em; }
h2 { font-size:1.15rem; margin:2.4em 0 .6em; padding-top:.6em;
     border-top:1px solid var(--line); }
h3 { font-size:1rem; margin:1.8em 0 .4em; color:var(--accent); }
p, li { font-size:.98rem; }
a { color:var(--accent); }
hr { border:0; border-top:1px solid var(--line); margin:2.4em 0; }
blockquote { margin:1.4em 0; padding:.9em 1.1em; background:var(--card);
             border-left:3px solid var(--accent); border-radius:0 6px 6px 0; }
blockquote p:first-child { margin-top:0; } blockquote p:last-child { margin-bottom:0; }
code { background:var(--card); padding:.12em .38em; border-radius:4px;
       font-size:.88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
em { color:var(--muted); font-style:normal; }
.table-wrap { overflow-x:auto; margin:1.4em 0; }
table { border-collapse:collapse; width:100%; font-size:.92rem; }
th, td { text-align:left; padding:.6em .8em; border-bottom:1px solid var(--line);
         vertical-align:top; }
th { font-weight:600; color:var(--muted); font-size:.85rem;
     text-transform:none; white-space:nowrap; }
ul, ol { padding-left:1.3em; }
li { margin:.35em 0; }
li > ul, li > ol { margin:.35em 0; }
footer { max-width:44rem; margin:4em auto 0; padding-top:1.5em;
         border-top:1px solid var(--line); color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<header class="site"><a href="./">리드몬</a></header>
<main>
<h1>리드몬</h1>
<p>가지고 있는 책을 AI 목소리로 읽어 주는 리더입니다.</p>
<ul>
<li><a href="privacy.html">개인정보 처리방침</a></li>
<li><a href="terms.html">이용약관</a></li>
</ul>
<p>문의: <a href="mailto:fogblue.git@gmail.com">fogblue.git@gmail.com</a></p>

</main>
<footer>리드몬 (Readmon)</footer>
</body>
</html>
